<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGESTRATION FORM</title>
</head>

<body>

    <h2>Student Registration Form</h2>

    <form action="#" method="post">

        <!-- Full Name -->
        <p>
            <label for="tex">Full Name:</label>
            <input type="text" id="tex" name="fullname" placeholder="Enter your full name" required>
        </p>

        <!-- Email -->
        <p>
            <label for=ema">Email:</label>
            <input type="email" id="ema" name="email" placeholder="Enter valid email address" required>
        </p>

        <!-- Password -->
        <p>
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="password" placeholder="Enter password" required>
        </p>

        <!-- Gender -->
        <p>
            <label>Gender:</label>

            <input type="radio" name="gender" value="Male" required>
            Male

            <input type="radio" name="gender" value="Female">
            Female

            <input type="radio" name="gender" value="Other">
            Other
        </p>

        <!-- Course -->
        <p>
            <label for="sel">Course:</label>

            <select id="sel" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="BTech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="MCA">MCA</option>
                <option value="MBA">MBA</option>
            </select>
        </p>

        <!-- Contact Number -->
        <p>
            <label for="con">Contact No:</label>

            <input type="tel" id="con" name="contact" placeholder="Enter phone number" required>
        </p>

        <!-- Address -->
        <p>
            <label for="are">Address:</label>
            <br>

            <textarea name="address" id="are" rows="4" cols="40" placeholder="Enter your address" required></textarea>
        </p>

        <!-- Submit and Reset -->
        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </p>

       

    </form>



</body>

</html>
